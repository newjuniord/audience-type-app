    secret: DODO_PAYMENTS_WEBHOOK_KEY
  - variable: BAZIK_USER_ID
    secret: BAZIK_USER_ID
  - variable: BAZIK_SECRET_KEY
    secret: BAZIK_SECRET_KEY
  - variable: FIREBASE_PRIVATE_KEY
    secret: FIREBASE_PRIVATE_KEY
  - variable: CRON_SECRET
    secret: CRON_SECRET
